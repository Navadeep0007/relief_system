{% if requests %}
<table class="table table-striped align-middle">
    <thead>
    <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Quantity</th>
        <th>Location</th>
        <th>Fulfilled</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    {% for r in requests %}
        <tr>
            <td>{{ r.title }}</td>
            <td>{{ r.category|default:"-" }}</td>
            <td>{{ r.quantity }}</td>
            <td>{{ r.location }}</td>
            <td>{{ r.is_fulfilled|yesno:"Yes,No" }}</td>
            <td>
                <a href="{% url 'core:request_update' r.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
    <p class="text-muted">No requests yet.</p>
{% endif %}
